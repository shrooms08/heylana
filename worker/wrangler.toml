# Heylana's proxy. Every key lives in this Worker; the phone holds none.
#
# Secrets are NOT here and must never be: put them with `wrangler secret put`
# (see README.md). This file is committed, so anything written in it is public.

name = "heylana-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-10"

[vars]
# Who speaks the answers: "deepgram" (Aura-2, Hera and Aries), "gemini" (Sulafat and
# Achird) or "cartesia". Unset means "gemini". /me tells the phone which, for its privacy
# line and voice picker.
VOICE_PROVIDER = "deepgram"

# Cartesia voice ids. Not secret: they name a voice, they do not buy anything.
VOICE_SKYLAR = "db6b0ed5-d5d3-463d-ae85-518a07d3c2b4"
VOICE_ARCHIE = "ef191366-f52f-447a-a398-ed8c0f2943a1"

# Replace with the project id from the Deepgram console before deploying.
DEEPGRAM_PROJECT_ID = "d65fab1f-f014-4150-9c80-3a192941040e"

# ---- Pro payments --------------------------------------------------------
# The treasury WALLET address (not a token account). Payments go to its
# associated token account for each token, created by the payer if missing.
TREASURY_ADDRESS = "7c2y8xXRFYVamzNJ11hX3sicHexPHNuDwpiJ6sEnSxSv"

# Circle's USDC on Solana mainnet.
USDC_MINT = "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"

# Copy the SKR mint from Solscan. Do not guess it: until this is a real
# address, SKR quotes answer "not set up" and USDC still works.
SKR_MINT = "SKRbvo6Gf7GondiT3BbTfuRDPqLWei4j2Qy2NPGZhW3"

# Price of 30 days of Pro in US dollars. "0.10" for a live smoke test, and
# back to "15" before submission. See README.md.
PRICE_USD = "0.10"
PRO_DAYS = "30"

# Which Solana payments are taken on: "mainnet-beta", or "devnet" to test with
# play money (then RPC_URL and USDC_MINT must be devnet too). See README.md.
CLUSTER = "devnet"

# Signing certificate SHA-256 fingerprints of the app, comma-separated, served at
# /.well-known/assetlinks.json so Seed Vault can verify the app. Not secret. The first
# is the debug certificate; add the release one after a comma. See README.md.
ASSETLINKS_SHA256 = "51:E4:C2:7A:95:E1:70:B3:42:D8:42:C2:1E:6A:1C:44:ED:7B:B0:2C:D9:6E:E0:F9:40:C7:E2:55:B4:72:10:A3"

# The last day of judging. A judge code gives Pro until the end of this day (UTC).
JUDGE_UNTIL = "2026-11-09"

# Per-device daily counters. Replace id with the one `wrangler kv namespace
# create CAPS` prints; see README.md.
[[kv_namespaces]]
binding = "CAPS"
id = "ed3f3ca828524b4a99f10cb45cf14bcd"
