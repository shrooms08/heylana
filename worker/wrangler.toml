# Heylana's proxy. Every key lives in this Worker; the phone holds none.
#
# Secrets are NOT here and must never be: put them with `wrangler secret put`
# (see README.md). This file is committed, so anything written in it is public.

name = "heylana-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-10"

# The address the phone knows. Kept explicit since a deploy without it turns it off.
workers_dev = true

# Heylana's own domain. The phone talks to api.heylana.xyz and tells the wallet it is
# heylana.xyz; both are this worker, so both serve /.well-known/assetlinks.json and the
# mark. It must not be a workers.dev host: the Wallet's scanner blocks a mainnet
# transaction asked for by one ("Scam site detected", seen on the Seeker 6 Oct 2026).
routes = [
  { pattern = "heylana.xyz", zone_name = "heylana.xyz", custom_domain = true },
  { pattern = "api.heylana.xyz", zone_name = "heylana.xyz", custom_domain = true },
]

[vars]
# Who speaks the answers: "deepgram" (Aura-2, Hera and Aries), "gemini" (Sulafat and
# Achird) or "cartesia". Unset means "gemini". /me tells the phone which, for its privacy
# line and voice picker.
VOICE_PROVIDER = "deepgram"

# Cartesia voice ids. Not secret: they name a voice, they do not buy anything.
VOICE_SKYLAR = "db6b0ed5-d5d3-463d-ae85-518a07d3c2b4"
VOICE_ARCHIE = "ef191366-f52f-447a-a398-ed8c0f2943a1"

# Replace with the project id from the Deepgram console before deploying.
DEEPGRAM_PROJECT_ID = "d65fab1f-f014-4150-9c80-3a192941040e"

# ---- Pro payments --------------------------------------------------------
# The treasury WALLET address (not a token account). Payments go to its
# associated token account for each token, created by the payer if missing.
TREASURY_ADDRESS = "7c2y8xXRFYVamzNJ11hX3sicHexPHNuDwpiJ6sEnSxSv"

# Circle's USDC on Solana mainnet. Devnet's test USDC is 4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU:
# swap it in (with CLUSTER and a devnet RPC_URL) to test with play money.
USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"

# Copy the SKR mint from Solscan. Do not guess it: until this is a real
# address, SKR quotes answer "not set up" and USDC still works.
SKR_MINT = "SKRbvo6Gf7GondiT3BbTfuRDPqLWei4j2Qy2NPGZhW3"

# What Pro costs: 30 days, and a year. Set PRICE_USD to "0.10" for a live smoke
# test and back to "5" before submission; a year is "40" (two months free).
# PRICE_YEAR_USD unset means a year cannot be bought and the sheet offers only a
# month. See README.md.
PRICE_USD = "5"
PRICE_YEAR_USD = "40"
PRO_DAYS = "30"

# Which mainnet RPC is tried first: "rpcfast" (RPC Fast, the default) or "helius".
# The other is the fallback, tried once when the first fails, answers a retryable
# error, or takes longer than 1200ms. Devnet always uses RPC_URL and has no
# fallback. The addresses themselves are secrets (RPCFAST_URL, MAINNET_RPC_URL,
# RPC_URL); see README.md.
RPC_PRIMARY = "rpcfast"

# What each thing costs, for the estimate /admin/usage returns. Models are dollars
# per million tokens, the voice per million characters, the ears per minute, and
# ears_session_seconds is how long one listening session is taken to be (the worker
# mints the pass and never hears the audio). Check these against each provider's
# pricing page and keep them current: they are the operator's figures, not a bill.
PRICES = """{"models":{"claude-haiku-4-5-20251001":{"in":1,"out":5},"claude-sonnet-5":{"in":3,"out":15}},"tts":{"deepgram":30,"gemini":30,"cartesia":65},"ears":{"deepgram":0.0077,"assemblyai":0.0025},"rpc":{"rpcfast":0,"helius":0,"devnet":0},"ears_session_seconds":8}"""

# Which Solana payments are taken on: "mainnet-beta", or "devnet" to test with
# play money (then RPC_URL and USDC_MINT must be devnet too). PRODUCT.md,
# "Mainnet switch before submission", has the steps; the phone needs no change.
CLUSTER = "mainnet-beta"

# Signing certificate SHA-256 fingerprints of the app, comma-separated, served at
# /.well-known/assetlinks.json so Seed Vault can verify the app. Not secret. The first
# is the debug certificate; add the release one after a comma. See README.md.
ASSETLINKS_SHA256 = "51:E4:C2:7A:95:E1:70:B3:42:D8:42:C2:1E:6A:1C:44:ED:7B:B0:2C:D9:6E:E0:F9:40:C7:E2:55:B4:72:10:A3,69:C0:A8:88:10:C9:FF:4C:4D:97:0F:4D:55:1D:DB:5B:A8:99:E8:6D:4E:48:AA:C0:F7:B7:C6:86:99:63:06:18"

# The last day of judging. A judge code gives Pro until the end of this day (UTC).
JUDGE_UNTIL = "2026-11-09"

# Per-device daily counters. Replace id with the one `wrangler kv namespace
# create CAPS` prints; see README.md.
[[kv_namespaces]]
binding = "CAPS"
id = "ed3f3ca828524b4a99f10cb45cf14bcd"

# The Solana knowledge base behind search_solana_kb: Workers AI embeds
# (@cf/baai/bge-base-en-v1.5) and Vectorize keeps the chunks. Created with
# `wrangler vectorize create heylana-kb --dimensions=768 --metric=cosine`;
# filled by scripts/kb/build.sh through /kb/ingest (secret KB_ADMIN_SECRET).
[ai]
binding = "AI"

[[vectorize]]
binding = "KB"
index_name = "heylana-kb"
